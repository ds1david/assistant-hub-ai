name: CI

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test

  transcription-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            services/transcription-service/requirements.txt
            services/transcription-service/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r services/transcription-service/requirements-dev.txt
      - run: python -m compileall services/transcription-service/app
      - run: PYTHONPATH=services/transcription-service pytest -q services/transcription-service/tests
      - name: Import smoke test
        run: |
          PYTHONPATH=services/transcription-service \
            python -c "from app.main import app; assert app.version == '0.1.7'"

  windows-audio-agent-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall agents/windows-audio-agent/src

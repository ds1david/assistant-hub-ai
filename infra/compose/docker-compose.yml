services:
  transcription:
    build:
      context: services/transcription-service
    container_name: assistant-hub-transcription
    ports:
      - "8001:8001"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_PATIENCE: ${WHISPER_PATIENCE:-1.0}
      WHISPER_TEMPERATURE: ${WHISPER_TEMPERATURE:-0.0}
      WHISPER_REPETITION_PENALTY: ${WHISPER_REPETITION_PENALTY:-1.05}
      WHISPER_NO_SPEECH_THRESHOLD: ${WHISPER_NO_SPEECH_THRESHOLD:-0.55}
      WHISPER_INITIAL_PROMPT: ${WHISPER_INITIAL_PROMPT:-Transcrição em português do Brasil. Preserve termos técnicos, nomes próprios, siglas, gírias e palavras coloquiais exatamente como foram pronunciadas.}
      WHISPER_HOTWORDS: ${WHISPER_HOTWORDS:-}
      WHISPER_HOTWORDS_FILE: ${WHISPER_HOTWORDS_FILE:-/config/whisper-hotwords.txt}
      WHISPER_WINDOW_SECONDS: ${WHISPER_WINDOW_SECONDS:-3.2}
      WHISPER_OVERLAP_SECONDS: ${WHISPER_OVERLAP_SECONDS:-0.8}
      WHISPER_MIN_AUDIO_SECONDS: ${WHISPER_MIN_AUDIO_SECONDS:-0.8}
      WHISPER_VAD_MIN_SILENCE_MS: ${WHISPER_VAD_MIN_SILENCE_MS:-350}
      ECHO_SUPPRESSION_ENABLED: ${ECHO_SUPPRESSION_ENABLED:-true}
      ECHO_SUPPRESSION_WINDOW_SECONDS: ${ECHO_SUPPRESSION_WINDOW_SECONDS:-5.0}
      ECHO_SUPPRESSION_SIMILARITY: ${ECHO_SUPPRESSION_SIMILARITY:-0.82}
      ECHO_SUPPRESSION_MIN_CHARS: ${ECHO_SUPPRESSION_MIN_CHARS:-5}
      ECHO_SUPPRESSION_MIC_DELAY_MS: ${ECHO_SUPPRESSION_MIC_DELAY_MS:-450}
      METRICS_MAX_SAMPLES_PER_CHANNEL: ${METRICS_MAX_SAMPLES_PER_CHANNEL:-512}
      METRICS_MAX_CHANNELS: ${METRICS_MAX_CHANNELS:-64}
      TRANSCRIPT_MAX_SEGMENTS_PER_CHANNEL: ${TRANSCRIPT_MAX_SEGMENTS_PER_CHANNEL:-256}
      TRANSCRIPT_MAX_CHANNELS: ${TRANSCRIPT_MAX_CHANNELS:-64}
      TRANSCRIPT_OVERLAP_TAIL_WORDS: ${TRANSCRIPT_OVERLAP_TAIL_WORDS:-12}
      MODEL_CACHE_DIR: /models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - whisper-models:/models
      - ./config:/config:ro
    restart: unless-stopped

  session-core:
    build:
      context: .
      dockerfile: services/session-core/Dockerfile
    container_name: assistant-hub-session-core
    ports:
      - "${SESSION_CORE_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      # Nome do serviço Compose — localhost não resolve entre containers.
      SESSION_CORE_TRANSCRIPT_FEED_URL: ${SESSION_CORE_TRANSCRIPT_FEED_URL:-ws://transcription:8001/ws/transcripts}
      SESSION_CORE_MEMORY_HUB_PATH: ${SESSION_CORE_MEMORY_HUB_PATH:-/data/session-core/memory-hub.db}
      SESSION_CORE_AI_PROVIDER_HUB_PATH: ${SESSION_CORE_AI_PROVIDER_HUB_PATH:-/config/ai-providers.yaml}
      # secretRef env:VAR — chaves opcionais propagadas do .env do host.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data/session-core:/data/session-core
      # rw: shell/API grava config/ai-providers.yaml (transcription monta o mesmo dir :ro).
      - ./config:/config
    # Ollama/NIM local no host WSL: use baseUrl http://host.docker.internal:11434/v1
    # (127.0.0.1 dentro do container é o próprio container, não o host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - transcription
    restart: unless-stopped

volumes:
  whisper-models:

version: 1

providers:
  - id: ollama-local
    label: Ollama local
    type: openai-compatible
    enabled: true
    baseUrl: http://127.0.0.1:11434/v1
    authentication:
      mode: none
    defaults:
      model: qwen3:8b
      temperature: 0.2
      maxTokens: 1024
      timeoutMs: 30000
    capabilities:
      - chat
      - streaming

  - id: nvidia-hosted
    label: NVIDIA NIM hosted
    type: openai-compatible
    enabled: false
    baseUrl: https://integrate.api.nvidia.com/v1
    authentication:
      mode: bearer
      secretRef: env:NVIDIA_API_KEY
    defaults:
      model: nvidia/llama-3.1-nemotron-nano-8b-v1
      temperature: 0.2
      maxTokens: 2048
      timeoutMs: 45000
    capabilities:
      - chat
      - streaming
      - tool-calling

  - id: custom-openai-compatible
    label: Endpoint OpenAI-compatible
    type: openai-compatible
    enabled: false
    baseUrl: https://example.invalid/v1
    authentication:
      mode: bearer
      secretRef: env:CUSTOM_AI_API_KEY
    defaults:
      model: configure-me
      temperature: 0.2
      maxTokens: 2048
      timeoutMs: 45000
    capabilities:
      - chat
      - streaming

routes:
  live-answer:
    primary: nvidia-hosted
    fallbacks:
      - ollama-local
  final-summary:
    primary: custom-openai-compatible
    fallbacks:
      - nvidia-hosted
  embeddings:
    primary: ollama-local

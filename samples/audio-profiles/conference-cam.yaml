version: 1
name: conference-cam
server: ws://127.0.0.1:8001
channels:
  - id: local_conference_cam
    label: Microfone da conference cam
    kind: input
    device:
      nameRegex: "Microfone.*(Conference|FHD Camera|Logi|Webcam|Cam)"
    processing:
      gainDb: 0
      noiseGateDb: -36

  - id: remote_conference_output
    label: Áudio remoto da conference cam
    kind: loopback
    device:
      nameRegex: "(Conference|FHD Camera|Logi|Webcam|Cam).*(Loopback|loopback)"
    processing:
      gainDb: 0
